services:
  fog-map:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      IMMICH_URL: https://photos.example.com
      IMMICH_API_KEY: ${IMMICH_API_KEY}   # put it in a .env file next to this one
      # Strongly recommended if anyone else can reach the page: it shows where your photos were taken.
      # BASIC_AUTH: me:change-this-password
      # IMMICH_REFRESH_HOURS: 6
