services:
  fog-map:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data   # Immich settings saved from the page (⚙ Settings)
    environment:
      # Strongly recommended if anyone else can reach the page: it shows where your photos were
      # taken and lets visitors change the Immich connection.
      # BASIC_AUTH: me:change-this-password
      # IMMICH_REFRESH_HOURS: 6
